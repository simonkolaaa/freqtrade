---
services:
  freqtrade:
    # Build custom image con python-dotenv preinstallato
    build:
      context: .
      dockerfile: "./docker/Dockerfile.custom"
    restart: unless-stopped
    container_name: freqtrade_ai
    volumes:
      - "./user_data:/freqtrade/user_data"
      # Monta il file .env nella root del container
      - "./.env:/freqtrade/.env:ro"
    # Porta su 0.0.0.0 per accesso remoto da AWS/VPS
    # Per uso locale cambia in: "127.0.0.1:8080:8080"
    ports:
      - "0.0.0.0:8080:8080"
    environment:
      # API Keys — lette dal file .env nella root del progetto
      - CRYPTOCOMPARE_API_KEY=${CRYPTOCOMPARE_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - FREQTRADE_UI_USERNAME=${FREQTRADE_UI_USERNAME}
      - FREQTRADE_UI_PASSWORD=${FREQTRADE_UI_PASSWORD}
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite
      --config /freqtrade/user_data/config.json
      --strategy AIsentimentStrategy
